spring:
  application:
    name: SupplyChainX
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true


springdoc:
  api-docs:
    path: /api-docs
  packages-to-scan: net.ayman.supplychainx
