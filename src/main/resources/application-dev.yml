spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/supply_db
    username: admin
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/supplychain
          jwk-set-uri: http://localhost:8081/realms/supplychain/protocol/openid-connect/certs

  main:
    allow-bean-definition-overriding: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: net.ayman.supplychainx
  cache:
    disabled: true


jwt:
  secret: ${JWT_SECRET:dev-secret-key-only-for-local-testing-do-not-use-in-production-12345678901234567890}
  expiration: 86400000

logging:
  level:
    root: INFO
    net.ayman.supplychainx: DEBUG
    org.springframework: INFO
    org.springframework.security: DEBUG
    net.ayman.supplychainx.common.security: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/supplychainx.log
    max-size: 10MB
    max-history: 30