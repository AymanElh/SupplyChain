spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/supply_db
    username: admin
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: net.ayman.supplychainx
  cache:
    disabled: true


logging:
  level:
    root: INFO
    net.ayman.supplychainx: DEBUG
    org.springframework: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/supplychainx.log
    max-size: 10MB
    max-history: 30