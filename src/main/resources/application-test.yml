spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  test:
    database:
      replace: none

logging:
  level:
    root: WARN
    net.ayman.supplychainx: INFO
    org.testcontainers: WARN

# Disable unnecessary features during tests
management:
  endpoints:
    web:
      exposure:
        include: health