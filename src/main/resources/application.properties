spring.application.name=SupplyChainX

# Database configuration (Postgres)

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/supply_db
spring.datasource.username=admin
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=none

# Swagger docs configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.packages-to-scan=net.ayman.supplychainx
springdoc.cache.disabled=true

# logs configuration
logging.level.root=INFO
logging.level.net.ayman.supplychainx=DEBUG
logging.level.org.springframework=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.file.name=logs/supplychainx.log
logging.file.max-size=10MB
logging.file.max-history=30